server:
  # 默认 8090 避免与已有 Java 项目（8080）冲突，可用 SERVER_PORT=xxxx 覆盖
  port: ${SERVER_PORT:8090}
  forward-headers-strategy: framework

openclaw:
  gateway:
    # 远程 Gateway 地址（与 custom_node.py 保持一致）
    url: ws://106.14.164.36:60013
    # 鉴权 token，从 ~/.openclaw/openclaw.json 读，或用环境变量 OPENCLAW_TOKEN 覆盖
    token: ${OPENCLAW_TOKEN:PUT_YOUR_GATEWAY_TOKEN_HERE}
    client-id: node-host
    client-mode: node
    role: operator
    scopes: operator.read,operator.write,operator.admin
  user:
    # 跟 custom_node.py 保持一致：feishu user open_id
    open-id: ou_d5aa91a8b0b72e7d9ef9bdb95794970d
  agent:
    id: cto
    # session-key-override: "agent:cto:feishu:direct:ou_d5aa91a8b0b72e7d9ef9bdb95794970d"
    # 2026-07-23 改：默认用 agent:cto:main（零历史）。浏览器对话跟飞书上下文断开，
    # 但飞书 session 已累积 1.2MB / 378 条 / 150k+ token,每次 chat.send 都要喂全 history,
    # 导致首字延迟 10s+。改用 main session 让浏览器快速跑通。
    # 需要恢复飞书互通时,取消上面那行的注释即可。
  device:
    # Ed25519 设备密钥持久化路径
    state-file: ${user.home}/.openclaw-voice-node/device.json
  # MiniMax T2A v2 直连配置（P2 用，不过 gateway）
  # 鉴权靠环境变量 TTS_API_KEY（~/.zshrc 里已 export，不写明文）
  # API 契约见 /Volumes/ssd/nodejs/node-v26.5.0-darwin-arm64/lib/node_modules/openclaw/dist/tts-BJz6m5ah.js
  tts:
    base-url: https://api.minimaxi.com
    api-key-env: TTS_API_KEY
    model: speech-2.8-hd
    voice-id: English_expressive_narrator
    format: mp3
    sample-rate: 32000
    speed: 1.0
    vol: 1.0
    pitch: 0

  # sherpa-onnx STT 配置（M1 用，模型跟 native lib 来自 scripts/download-stt-deps.sh）
  # 模型目录用 ${user.dir}（JVM 系统属性，Spring 自动展开）让 dev/prod 都能跑
  # 注意：${project.basedir} 是 Maven resource-filter 占位符,不会在运行时展开
  stt:
    model-dir: ${user.dir}/models/stt
    num-threads: 2
    sample-rate: 16000

talk:
  # 默认 mode = stt-tts + managed-room（不依赖 OpenAI Realtime 账号）
  mode: stt-tts
  transport: managed-room
  brain: agent-consult

logging:
  level:
    com.openclaw.voicenode: DEBUG
    org.java_websocket: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{30} - %msg%n"
